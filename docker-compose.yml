services:
  postgres:
    image: postgres:16-alpine
    container_name: codesnap-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: codesnap
      POSTGRES_PASSWORD: codesnap123
      POSTGRES_DB: codesnap
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
