services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: codesnap-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: codesnap
      POSTGRES_PASSWORD: codesnap123
      POSTGRES_DB: codesnap
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codesnap -d codesnap"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codesnap-network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codesnap-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://codesnap:codesnap123@postgres:5432/codesnap
      JWT_SECRET: your-super-secret-key-at-least-32-chars-long
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - codesnap-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/api/v1/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

volumes:
  postgres-data:
    driver: local

networks:
  codesnap-network:
    driver: bridge
